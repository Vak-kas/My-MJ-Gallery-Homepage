{% load static blog_extras %}
    <section data-section="blog_links" class="mx-auto mt-20 max-w-[1320px] pb-24">
        <div class="overflow-hidden rounded-[30px] border border-black/[0.08] bg-white p-7 md:p-10">
            <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
                <div>
                    <p class="text-[12px] uppercase tracking-[0.24em] text-[#0066cc]">NEXT STEP</p>
                    <h3 class="mt-3 text-[32px] font-semibold tracking-[-0.03em] text-[#1d1d1f] md:text-[44px]">더 자세한 내용을 보고 싶다면</h3>
                    <p class="mt-3 text-[16px] leading-[1.6] text-[#6e6e73]">카테고리별 페이지에서 글을 확인하세요.</p>
                </div>
            </div>

            {% home_blog_categories as home_cats %}
            <div class="mt-8 grid gap-3 md:grid-cols-2{% if home_cats|length >= 4 %} lg:grid-cols-4{% elif home_cats|length == 3 %} lg:grid-cols-3{% endif %}">
                {% for c in home_cats %}
                <a href="{% url 'blog:category' c.slug %}" class="group relative overflow-hidden rounded-[18px] border border-black/[0.08] bg-[#fbfbfd] px-5 py-4 transition hover:border-[#0066cc]/25 hover:bg-white">
                    <img src="{% static 'images/mj-logo.svg' %}" alt="" aria-hidden="true" class="pointer-events-none absolute right-3 top-3 h-5 w-5 opacity-20">
                    <p class="text-[12px] uppercase tracking-[0.18em]" style="color: {{ c.color }};">{{ c.icon }} Blog</p>
                    <p class="mt-2 text-[17px] font-semibold text-[#1d1d1f]">{{ c.name }}</p>
                    {% if c.description %}<p class="mt-1 text-[13px] text-[#6e6e73]">{{ c.description }}</p>{% endif %}
                </a>
                {% endfor %}
            </div>
        </div>
    </section>
