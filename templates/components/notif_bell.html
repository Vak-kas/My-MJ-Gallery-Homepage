{% if user.is_superuser %}
<a href="{% url 'notifications:list' %}" title="알림{% if notif_unread_count %} {{ notif_unread_count }}개{% endif %}" aria-label="알림"
   class="{{ bell_class|default:'border border-black/[0.1] text-[#1d1d1f] hover:bg-[#f5f5f7]' }} relative inline-flex h-[30px] w-[34px] items-center justify-center rounded-full text-[14px]">
    🔔
    {% if notif_unread_count %}
    <span class="absolute -right-1.5 -top-1.5 min-w-[18px] rounded-full bg-[#ff3b30] px-1 text-center text-[11px] font-semibold leading-[18px] text-white">{% if notif_unread_count > 99 %}99+{% else %}{{ notif_unread_count }}{% endif %}</span>
    {% endif %}
</a>
{% endif %}
