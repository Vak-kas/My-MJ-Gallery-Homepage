{% comment %}
모든 페이지 오른쪽 아래 "맨 위로" 버튼 — 원 안에 물이 스크롤한 만큼 차오르는 게이지 (물결이 계속 일렁임).
가운데는 평소 ↑, 마우스를 올리면 지금 읽은 %. 물에 잠긴 부분의 글자·화살표는 흰색으로 바뀜.
화면 높이의 60% 넘게 내려오면 나타남.
{% endcomment %}
<button id="scroll-top-btn" type="button" class="scroll-top" aria-label="맨 위로" title="맨 위로" tabindex="-1">
    <svg viewBox="0 0 58 58" aria-hidden="true">
        <defs>
            <clipPath id="scroll-top-circle"><circle cx="29" cy="29" r="27"/></clipPath>
            <clipPath id="scroll-top-under"><rect id="scroll-top-under-rect" x="0" y="58" width="58" height="60"/></clipPath>
            <linearGradient id="scroll-top-water-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="36">
                <stop offset="0" stop-color="#4c9bff"/>
                <stop offset="1" stop-color="#0058b0"/>
            </linearGradient>
        </defs>
        <circle class="scroll-top__bg" cx="29" cy="29" r="28.5"/>
        <g clip-path="url(#scroll-top-circle)">
            <g id="scroll-top-water" class="scroll-top__water" style="transform: translateY(56px)">
                {# 물결 한 주기 = 58, 두 주기를 그려 두고 옆으로 흘려 이어지게 #}
                <path class="scroll-top__wave is-back" d="M0 0 Q14.5 -3.2 29 0 T58 0 T87 0 T116 0 V70 H0 Z"/>
                <path class="scroll-top__wave is-front" d="M0 1 Q14.5 4 29 1 T58 1 T87 1 T116 1 V70 H0 Z"/>
            </g>
        </g>
        {# 같은 글자를 두 번: 위는 기본색, 아래는 물에 잠긴 만큼만 흰색 #}
        <g class="scroll-top__face">
            <g class="scroll-top__ink">
                <path class="scroll-top__arrow" d="M22.5 28 29 21.5l6.5 6.5M29 22v14"/>
                <text class="scroll-top__pct" x="29" y="33.5" text-anchor="middle"><tspan class="scroll-top__num" data-scroll-top-num>0</tspan><tspan class="scroll-top__unit" dx="0.6">%</tspan></text>
            </g>
            <g class="scroll-top__ink is-under" clip-path="url(#scroll-top-under)">
                <path class="scroll-top__arrow" d="M22.5 28 29 21.5l6.5 6.5M29 22v14"/>
                <text class="scroll-top__pct" x="29" y="33.5" text-anchor="middle"><tspan class="scroll-top__num" data-scroll-top-num>0</tspan><tspan class="scroll-top__unit" dx="0.6">%</tspan></text>
            </g>
        </g>
    </svg>
</button>
<style>
    .scroll-top { position: fixed; right: 20px; bottom: 20px; z-index: 80; width: 52px; height: 52px; padding: 0; border: 0; background: transparent; border-radius: 9999px; cursor: pointer; opacity: 0; transform: translateY(10px) scale(.9); pointer-events: none; transition: opacity .3s ease, transform .3s ease; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .12)); }
    .scroll-top.is-shown { opacity: 1; transform: none; pointer-events: auto; }
    .scroll-top svg { width: 100%; height: 100%; display: block; }
    .scroll-top__bg { fill: rgba(255, 255, 255, .96); stroke: rgba(0, 0, 0, .1); stroke-width: 1; }
    .scroll-top__water { transition: transform .35s cubic-bezier(.22, .61, .36, 1); }
    .scroll-top__wave { animation: scrollTopWave 2.8s linear infinite; }
    .scroll-top__wave.is-back { fill: #9cc8ff; opacity: .7; animation-duration: 4.2s; animation-direction: reverse; }
    .scroll-top__wave.is-front { fill: url(#scroll-top-water-grad); }
    @keyframes scrollTopWave { from { transform: translateX(0); } to { transform: translateX(-58px); } }
    .scroll-top__arrow { fill: none; stroke: #0066cc; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; transition: opacity .2s, transform .25s ease; }
    .scroll-top__pct { opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .25s ease; fill: #0b3d75; font-family: "Pretendard Variable", Pretendard, system-ui, -apple-system, BlinkMacSystemFont, sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
    .scroll-top__num { font-size: 16px; font-weight: 800; letter-spacing: -.8px; }
    .scroll-top__unit { font-size: 9px; font-weight: 700; opacity: .7; }
    .scroll-top__ink.is-under .scroll-top__arrow { stroke: #fff; }
    .scroll-top__ink.is-under .scroll-top__pct { fill: #fff; }
    .scroll-top:hover .scroll-top__arrow, .scroll-top:focus-visible .scroll-top__arrow { opacity: 0; transform: translateY(-4px); }
    .scroll-top:hover .scroll-top__pct, .scroll-top:focus-visible .scroll-top__pct { opacity: 1; transform: none; }
    .scroll-top:focus-visible { outline: 2px solid #0066cc; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .scroll-top__wave { animation: none; } .scroll-top, .scroll-top__water { transition: none; } }
    html.theme-dark .scroll-top { filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .45)); }
    html.theme-dark .scroll-top__bg { fill: rgba(28, 31, 38, .96); stroke: rgba(78, 161, 255, .35); }
    html.theme-dark .scroll-top__arrow { stroke: #4ea1ff; }
    html.theme-dark .scroll-top__pct { fill: #dbeafe; }
    html.theme-dark .scroll-top__wave.is-back { fill: #1e4f8c; }
</style>
<script>
    (() => {
        const btn = document.getElementById('scroll-top-btn');
        const water = document.getElementById('scroll-top-water');
        const under = document.getElementById('scroll-top-under-rect');
        if (!btn || !water || !under) return;
        const nums = btn.querySelectorAll('[data-scroll-top-num]');
        // 원 안쪽 y 3(위) ~ 55(아래). 0% 면 바닥, 100% 면 가득 (물결 높이만큼 조금 더)
        const EMPTY = 56, FULL = 0;
        let raf = 0;
        const update = () => {
            raf = 0;
            const max = document.documentElement.scrollHeight - window.innerHeight;
            const progress = max > 0 ? Math.min(window.scrollY / max, 1) : 0;
            const level = EMPTY - (EMPTY - FULL) * progress;
            water.style.transform = `translateY(${level.toFixed(2)}px)`;
            under.setAttribute('y', (level + 1).toFixed(2));
            const n = Math.round(progress * 100);
            nums.forEach((t) => { t.textContent = n; });
            const shown = window.scrollY > window.innerHeight * 0.6;
            btn.classList.toggle('is-shown', shown);
            btn.tabIndex = shown ? 0 : -1;
            btn.setAttribute('aria-label', `맨 위로 (${n}% 읽음)`);
        };
        const onScroll = () => { if (!raf) raf = requestAnimationFrame(update); };
        btn.addEventListener('click', () => {
            const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
        });
        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('resize', onScroll);
        update();
    })();
</script>
