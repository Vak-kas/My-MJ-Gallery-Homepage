{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-[#f5f5f7]">
    <div class="flex min-h-screen items-center justify-center px-6 py-20">
        <div class="w-full max-w-[520px] rounded-[28px] border border-black/[0.06] bg-white p-12 text-center">
            <p class="text-[48px]">📮</p>
            <h1 class="mt-4 text-[32px] font-semibold tracking-[-0.03em] text-[#1d1d1f]">가입 신청이 접수됐어요</h1>
            <p class="mt-4 text-[16px] leading-7 text-[#6e6e73]">
                <b class="text-[#1d1d1f]">{{ pending_user.username }}</b> 님, 관리자가 확인한 뒤 승인하면<br>
                같은 아이디와 비밀번호로 로그인할 수 있어요.
            </p>
            <div class="mt-8 flex justify-center gap-3">
                <a href="{% url 'main:home' %}" class="rounded-full border border-black/[0.1] px-6 py-3 text-[15px] text-[#1d1d1f] hover:bg-[#f5f5f7]">홈으로</a>
                <a href="{% url 'accounts:login' %}" class="rounded-full bg-[#0066cc] px-6 py-3 text-[15px] text-white">로그인 화면</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
