<!doctype html>
<html lang="ko">
<body style="margin:0;padding:32px 16px;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#1d1d1f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:20px;">
    <tr><td style="padding:36px 32px;">
      <p style="margin:0;font-size:12px;letter-spacing:0.2em;color:#0066cc;">MJ GALLERY</p>
      <h1 style="margin:16px 0 8px;font-size:24px;">이메일 인증을 완료해 주세요</h1>
      <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#6e6e73;">
        {{ user.get_username }} 님, 가입해 주셔서 감사합니다.<br>아래 버튼을 누르면 인증이 완료되고 바로 로그인됩니다.
      </p>
      <a href="{{ verify_url }}" style="display:inline-block;padding:14px 28px;border-radius:999px;background:#0066cc;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">이메일 인증하기</a>
      <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#8e8e93;">
        버튼이 안 눌리면 이 주소를 브라우저에 붙여넣으세요:<br>
        <a href="{{ verify_url }}" style="color:#0066cc;word-break:break-all;">{{ verify_url }}</a><br><br>
        링크는 {{ valid_hours }}시간 동안 유효합니다. 직접 가입하지 않았다면 이 메일은 무시하셔도 됩니다.
      </p>
    </td></tr>
  </table>

</html>
