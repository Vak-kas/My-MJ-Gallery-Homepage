<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>연결이 끊겼어요 — MJ Gallery</title>
    <style>
        :root { color-scheme: light dark; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
        .box { max-width: 340px; padding: 32px 24px; text-align: center; }
        .icon { font-size: 44px; }
        h1 { margin: 12px 0 6px; font-size: 22px; letter-spacing: -0.02em; }
        p { margin: 0; font-size: 14px; line-height: 1.6; color: #6e6e73; }
        button { margin-top: 20px; border: 0; border-radius: 999px; background: #0066cc; color: #fff; padding: 10px 22px; font-size: 15px; font-weight: 600; }
        @media (prefers-color-scheme: dark) { body { background: #0f1115; color: #f3f4f6; } p { color: #a1a1aa; } }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>인터넷 연결이 끊겼어요</h1>
        <p>와이파이나 데이터를 확인한 뒤 다시 시도해 주세요.</p>
        <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
